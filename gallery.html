/* Лайтбокс */
.lightbox{

  background:rgba(0,0,0,0.95);backdrop-filter:blur(20px);
  align-items:center;justify-content:center;padding:2rem;
}
.lightbox.open{display:flex;}
.lightbox img{max-width:90vw;max-height:85vh;border-radius:var(--radius);object-fit:contain;}
.lightbox-close{

}
.lightbox-nav{

  background:rgba(255,255,0,0.15);border:1px solid rgba(255,255,0,0.2);
  color:var(--yellow);width:50px;height:50px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;cursor:pointer;transition:all 0.3s;
}
.lightbox-nav:hover{background:var(--yellow);color:var(--black);}
.lightbox-prev{left:1.5rem;}
.lightbox-next{right:1.5rem;}

<!-- Лайтбокс для просмотра фото -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <button class="lightbox-nav lightbox-prev" onclick="navLightbox(-1)">‹</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-nav lightbox-next" onclick="navLightbox(1)">›</button>
</div>

<script>
// Лайтбокс — список строится по порядку сетки, работает и с закешированными фото
let currentIdx = 0;
function visibleSrcs() {
  return Array.from(document.querySelectorAll('.gallery-item'))
    .filter(w => w.style.display !== 'none')
    .map(w => w.querySelector('img').src);
}
document.querySelectorAll('.gallery-item img').forEach(img => {
  img.addEventListener('click', () => {
    const list = visibleSrcs();
    currentIdx = Math.max(0, list.indexOf(img.src));
    document.getElementById('lightboxImg').src = img.src;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  });
});

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function navLightbox(dir) {
  const list = visibleSrcs();
  if (!list.length) return;
  currentIdx = (currentIdx + dir + list.length) % list.length;
  document.getElementById('lightboxImg').src = list[currentIdx];
}
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});
</script>
